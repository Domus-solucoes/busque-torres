<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mascotes · Prévia das 900 cenas anuais</title><style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#f5f7fa;color:#193853;font:14px system-ui,Arial,sans-serif}.wrap{max-width:940px;margin:auto}.bar{display:flex;flex-wrap:wrap;align-items:end;gap:9px;margin:10px 0}.bar label{flex:1;min-width:130px;display:grid;gap:4px;font-size:12px;font-weight:700}.bar select,.bar button{border:1px solid #c9d5e0;border-radius:9px;background:#fff;color:#234764;min-height:43px;padding:10px;font:inherit;cursor:pointer}.bar button{font-weight:750}.stage{height:auto;min-height:230px;aspect-ratio:600/350;background:#d5e9ee;border-radius:12px;position:relative;overflow:hidden;box-shadow:0 10px 25px #14365222}.stage #bt-natal{position:absolute;inset:0}.stage svg{display:block;width:100%;height:100%}.stage .bt-replay{position:absolute;bottom:15px;right:15px;border:1px solid #ead29b;border-radius:22px;background:#173852;color:white;padding:8px 14px;font-weight:700;cursor:pointer}.hint{color:#5a6f83;font-size:12px;line-height:1.55}.tag{display:inline-block;padding:5px 9px;border-radius:20px;background:#e4edf7;color:#325a7b;font-size:12px}</style></head><body><main class="wrap"><span class="tag">Prévia do motor anual · 450 capivaras + 450 lobos-marinhos</span><div class="bar"><label>Personagem<select id="animal"><option value="capi">Capivara</option><option value="lobo">Lobo-marinho</option></select></label><label>Estação / mês<select id="month"></select></label><label>Cena<select id="scene"></select></label><button type="button" id="next">Próxima animação</button></div><div class="stage"><div id="bt-natal" hidden></div></div><p class="hint" id="label"></p><p class="hint">Cada animal tem 450 identificadores de cena, somando 900. O motor monta somente uma animação vetorial a cada reprodução. A versão pública usa o sorteio diário sem repetição. Esta galeria serve exclusivamente para conferir os movimentos.</p></main><script>
const titles=["café","chimarrão","sorvete","melancia","bola","presente","livro","violão","flores","coração","estrela","guarda-chuva","pipa","balão","câmera","bicicleta","skate","prancha","coco","pizza","pipoca","chapéu","óculos","medalha","folha","concha","barco","tambor","lua","peixe","farol","castelo de areia","caiaque","pesca","mergulho","piquenique","borboletas","jardinagem","balonismo","corrida","patins","basquete","tênis","cinema","pintura","música","chocolate quente","tricô","fotografia","aventura","mar","pôr do sol","arco-íris","amigos","passeio","praça","sanfona","festa","cachoeira","livraria","conchas na praia","bodyboard","caranguejo","frisbee","girassóis","joaninhas","estrelas do céu","robô","carrinhos","origami","quebra-cabeça","futebol","boliche","musculação","peteca","maracas","flauta","chá","panquecas","cupcakes","patinete","jogo de tabuleiro","desenho","acampamento","dança","coração de flores","skate na praia","aventura na lagoa","artesanato","passeio ao farol"];
const scene=document.querySelector("#scene"),animal=document.querySelector("#animal"),month=document.querySelector("#month");
for(let m=1;m<=12;m++)month.add(new Option(new Date(2027,m-1,1).toLocaleString("pt-BR",{month:"long"}),m));
for(let i=0;i<450;i++)scene.add(new Option(String(i+1).padStart(3,"0")+" · "+titles[Math.floor(i/5)]+" · movimento "+(i%5+1),i));
window.BT_MASCOTES_PREVIEW={animal:"capi",id:0,month:1};</script><script src="js/mascotes-2027.js"></script><script>
function show(){const data={animal:animal.value,id:+scene.value,month:+month.value};window.BT_MASCOTES_RENDER?.(data);document.querySelector("#label").textContent=(animal.value==="capi"?"Capivara":"Lobo-marinho")+" · "+titles[Math.floor(data.id/5)]+" · animação "+(data.id+1)+" de 450";}
scene.onchange=animal.onchange=month.onchange=show;document.querySelector("#next").onclick=()=>{scene.value=(+scene.value+1)%450;show()};show();
</script></body></html>
