<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#081b33">
<title>Empresa — Busque Torres</title>
<style>
:root{--navy:#081b33;--navy2:#123b63;--gold:#e6b84b;--bg:#f5f7fb;--surface:#fff;--text:#172033;--muted:#667085;--line:#e5eaf0;--green:#20bf6b;--shadow:0 18px 45px rgba(8,27,51,.12);--max:1050px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif}a{color:inherit}.top{background:linear-gradient(135deg,#06162b,#123b63);padding:18px 0;color:#fff}.shell{width:min(var(--max),calc(100% - 28px));margin:auto}.nav{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:950;text-decoration:none;color:#fff}.brand b{color:var(--gold)}.back{padding:10px 15px;border:1px solid rgba(255,255,255,.18);border-radius:12px;text-decoration:none;font-weight:800}.profile{overflow:hidden;margin:28px auto;border:1px solid var(--line);border-radius:26px;background:var(--surface);box-shadow:var(--shadow)}.cover{position:relative;height:390px;background:linear-gradient(135deg,#dce8f5,#f0f5fa)}.cover>img{width:100%;height:100%;object-fit:cover;display:block}.fallback{position:absolute;inset:0;display:grid;place-items:center;font-size:5rem}.cover.has-image .fallback{display:none}.cover:after{content:"";position:absolute;inset:auto 0 0;height:55%;background:linear-gradient(transparent,rgba(4,17,33,.72))}.logo{position:absolute;z-index:2;left:34px;bottom:-45px;display:grid;place-items:center;width:96px;height:96px;overflow:hidden;border:5px solid #fff;border-radius:25px;background:var(--navy);color:#fff;font-size:1.7rem;font-weight:950;box-shadow:0 12px 25px rgba(8,27,51,.25)}.logo img{width:100%;height:100%;object-fit:cover}.premium{position:absolute;z-index:2;right:24px;top:22px;padding:8px 12px;border-radius:999px;background:var(--gold);color:var(--navy);font-size:.76rem;font-weight:950}.body{padding:66px 34px 34px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}.head h1{margin:0;color:var(--navy);font-size:clamp(2rem,5vw,3rem);letter-spacing:-.045em}.category{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:9px;background:#eef2f6;color:#556277;font-size:.74rem;font-weight:900;text-transform:uppercase}.location{margin-top:12px;color:var(--muted);font-weight:700}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:25px 0}.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 19px;border-radius:13px;text-decoration:none;font-weight:900}.whats{background:var(--green);color:#fff}.instagram{background:var(--navy);color:#fff}.email{background:#eef2f6;color:var(--navy)}.map{background:var(--gold);color:var(--navy)}.outline{border:1px solid var(--line);color:var(--navy)}.grid{display:grid;grid-template-columns:1.45fr .75fr;gap:24px}.column{display:grid;gap:24px;align-content:start}.box{padding:24px;border:1px solid var(--line);border-radius:18px;background:#fff}.box h2{margin:0 0 13px;color:var(--navy);font-size:1.25rem}.description{margin:0;color:#4f5d70;line-height:1.75;white-space:pre-line}.details{display:grid;gap:15px}.detail strong{display:block;margin-bottom:4px;color:var(--navy);font-size:.82rem;text-transform:uppercase}.detail span,.detail a{color:var(--muted);text-decoration:none;line-height:1.5;word-break:break-word}.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{padding:9px 12px;border-radius:999px;background:#eef3f7;color:#31445b;font-size:.88rem;font-weight:750}.empty-text{margin:0;color:var(--muted)}.not-found{display:none;margin:50px auto;padding:45px;border:1px solid var(--line);border-radius:22px;background:#fff;text-align:center}.not-found.show{display:block}@media(max-width:760px){.nav{align-items:flex-start}.back{font-size:.82rem;padding:9px 11px}.cover{height:270px}.logo{left:20px;width:80px;height:80px;bottom:-38px}.body{padding:56px 20px 24px}.head{flex-direction:column}.grid{grid-template-columns:1fr}.actions .btn{flex:1;min-width:145px}}@media(max-width:460px){.shell{width:calc(100% - 18px)}.cover{height:220px}.actions{display:grid;grid-template-columns:1fr}.actions .btn{width:100%;min-width:0}.box{padding:18px}.cover{height:230px}.profile{border-radius:18px}.head h1{font-size:2rem}}
</style>
</head>
<body>
<header class="top"><div class="shell nav"><a class="brand" href="index.html">Busque <b>Torres</b></a><a class="back" href="index.html">← Voltar</a></div></header>
<main class="shell">
<article class="profile" id="profile" hidden>
<div class="cover" id="cover"><img id="coverImage" alt="" hidden><div class="fallback" id="fallback"></div><span class="premium" id="premium" hidden>Destaque</span><div class="logo" id="logo"><span id="initials">EM</span><img id="logoImage" alt="" hidden></div></div>
<div class="body">
<div class="head"><div><h1 id="name"></h1><span class="category" id="category"></span><div class="location" id="location"></div></div></div>
<div class="actions"><a class="btn whats" id="whatsapp" target="_blank" rel="noopener noreferrer">WhatsApp</a><a class="btn instagram" id="instagram" target="_blank" rel="noopener noreferrer" hidden>Instagram</a><a class="btn outline" id="site" target="_blank" rel="noopener noreferrer" hidden>Site</a><a class="btn email" id="emailButton" hidden>E-mail</a><a class="btn map" id="mapButton" target="_blank" rel="noopener noreferrer" hidden>Como chegar</a></div>
<div class="grid">
<div class="column">
<section class="box"><h2>Sobre a empresa</h2><p class="description" id="description"></p></section>
<section class="box" id="productsBox" hidden><h2>Produtos</h2><div class="chips" id="products"></div></section>
<section class="box" id="servicesBox" hidden><h2>Serviços</h2><div class="chips" id="services"></div></section>
</div>
<aside class="box details">
<div class="detail"><strong>Endereço</strong><span id="address"></span></div>
<div class="detail"><strong>Telefone / WhatsApp</strong><a id="phone" target="_blank" rel="noopener noreferrer"></a></div>
<div class="detail" id="emailWrap" hidden><strong>E-mail</strong><a id="emailLink"></a></div>
<div class="detail" id="hoursWrap" hidden><strong>Horário</strong><span id="hours"></span></div>
<div class="detail" id="siteWrap" hidden><strong>Site</strong><a id="siteDetail" target="_blank" rel="noopener noreferrer"></a></div>
</aside>
</div></div></article>
<section class="not-found" id="notFound"><h1>Empresa não encontrada</h1><p>O cadastro pode estar aguardando aprovação, vencido ou ter sido removido.</p><a href="index.html">Voltar para a vitrine</a></section>
</main>
<script src="supabase-config.js"></script>
<script>
"use strict";
const $=id=>document.getElementById(id);
const categoryInfo={alimentacao:{name:"Alimentação"},saude:{name:"Saúde"},beleza:{name:"Beleza"},pets:{name:"Pets"},automotivo:{name:"Automotivo"},construcao:{name:"Construção"},casa:{name:"Casa e Lar"},comercio:{name:"Comércio"},tecnologia:{name:"Tecnologia"},educacao:{name:"Educação"},esportes:{name:"Esportes"},profissionais:{name:"Profissionais"},eventos:{name:"Eventos"},turismo:{name:"Turismo"},agro:{name:"Agro"},transporte:{name:"Transporte"},industria:{name:"Indústria"},servicos:{name:"Serviços"},publicos:{name:"Serviços Públicos"},religiao:{name:"Religião"},outros:{name:"Outros"}};
const MESSAGE="Olá, vim do Busque Torres e gostaria de mais informações.";
function digits(v){return String(v||"").replace(/\D/g,"")}
function whats(v){let n=digits(v);if(n.length===10||n.length===11)n="55"+n;return n?`https://wa.me/${n}?text=${encodeURIComponent(MESSAGE)}`:""}
function media(v){v=String(v||"").trim();if(v.startsWith("data:image/"))return v;try{const u=new URL(v);return ["http:","https:"].includes(u.protocol)?u.href:""}catch{return ""}}
function safe(v){try{const u=new URL(v);return ["http:","https:"].includes(u.protocol)?u.href:""}catch{return ""}}
function initials(n){const p=String(n||"").trim().split(/\s+/).filter(Boolean);return p.length>1?(p[0][0]+p.at(-1)[0]).toUpperCase():(p[0]||"EM").slice(0,2).toUpperCase()}
function listItems(value){return String(value||"").split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean)}
function fillChips(id,boxId,value){const items=listItems(value);if(!items.length)return;const target=$(id);target.replaceChildren();items.forEach(item=>{const span=document.createElement("span");span.className="chip";span.textContent=item;target.appendChild(span)});$(boxId).hidden=false}
function show(c){const info=categoryInfo[c.categoria]||{name:"Empresa"};$("name").textContent=c.nome||"Empresa";document.title=(c.nome||"Empresa")+" — Busque Torres";$("category").textContent=c.subcategoria?info.name+" • "+c.subcategoria:info.name;$("fallback").textContent=initials(c.nome);$("description").textContent=c.descricao||"Conheça esta empresa local.";$("location").textContent=[c.bairro,c.cidade].filter(Boolean).join(" • ")||"Atendimento local";$("address").textContent=[c.endereco,c.bairro,c.cidade].filter(Boolean).join(" • ")||"Endereço não informado";const w=whats(c.whatsapp);$("whatsapp").href=w;$("phone").href=w;$("phone").textContent=c.whatsapp||"Abrir WhatsApp";const ig=safe(c.instagram);if(ig){$("instagram").href=ig;$("instagram").hidden=false}const site=safe(c.site);if(site){$("site").href=site;$("site").hidden=false;$("siteWrap").hidden=false;$("siteDetail").href=site;$("siteDetail").textContent=c.site}if(c.email){const mail="mailto:"+c.email;$("emailButton").href=mail;$("emailButton").hidden=false;$("emailWrap").hidden=false;$("emailLink").href=mail;$("emailLink").textContent=c.email}if(c.horario){$("hours").textContent=c.horario;$("hoursWrap").hidden=false}const map=safe(c.mapa_url);if(map){$("mapButton").href=map;$("mapButton").hidden=false}fillChips("products","productsBox",c.produtos);fillChips("services","servicesBox",c.servicos);$("premium").hidden=!["destaque","master"].includes(c.plano);$("premium").textContent=c.plano==="master"?"Master":"Destaque";$("initials").textContent=initials(c.nome);const cover=media(c.imagem_url);if(cover){$("coverImage").src=cover;$("coverImage").alt="Foto de "+c.nome;$("coverImage").hidden=false;$("cover").classList.add("has-image")}const logo=media(c.logo_url);if(logo){$("logoImage").src=logo;$("logoImage").alt="Logotipo de "+c.nome;$("logoImage").hidden=false;$("initials").hidden=true}$("profile").hidden=false}
(async()=>{const id=new URLSearchParams(location.search).get("id");if(!id){$("notFound").classList.add("show");return}try{const rows=await BusqueAPI.select("empresas_publicas",`select=*&id=eq.${encodeURIComponent(id)}&limit=1`);if(Array.isArray(rows)&&rows[0])show(rows[0]);else $("notFound").classList.add("show")}catch(error){console.error(error);$("notFound").classList.add("show")}})();
</script>
</body></html>
