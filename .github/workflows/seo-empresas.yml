name: Atualizar SEO das empresas

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3,15,21 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/gerar-seo-empresas.mjs'
      - '.github/workflows/seo-empresas.yml'

permissions:
  contents: write

concurrency:
  group: seo-empresas
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gerar páginas SEO e sitemap
        run: node scripts/gerar-seo-empresas.mjs
        env:
          SITE_ORIGIN: https://busquetorres.com.br
          CIDADE_ID: torres
          SUPABASE_URL: https://xwkmsqawiimouilldwit.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_yDaiyt-jns7xIhSd5MHrrQ_jcSi_r_s

      - name: Publicar alterações geradas
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add empresa sitemap.xml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração SEO para publicar."
            exit 0
          fi
          git commit -m "Atualizar páginas SEO automáticas"
          git push
