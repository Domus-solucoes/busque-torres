<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Busque Cardápio</title><link rel="stylesheet" href="styles.css"><script src="../supabase-config.js"></script><script src="cardapio-core.js"></script></head><body>
<header class="top"><div class="shell topin"><a class="brand" href="./"><div class="brandmark">B</div><div>Busque Cardápio<small>Pedidos locais em Torres</small></div></a><div class="actions"><a class="btn" href="cadastro.html">Cadastrar empresa</a><a class="btn primary" href="painel.html">Área da empresa</a></div></div></header>
<section class="hero"><div class="shell"><h1>Peça direto dos estabelecimentos de Torres.</h1><p>Escolha uma empresa, monte o pedido e pague pelo meio de recebimento configurado por ela.</p></div></section>
<main class="shell main"><div class="field"><input id="busca" placeholder="Buscar restaurante, lancheria, pizzaria..."></div><div id="lista" class="est-grid"></div><section id="menuWrap" class="hidden"><div class="inline" style="margin:18px 0"><button class="btn" id="voltar">← Voltar</button><div><h2 id="empresaNome" style="margin:0;color:var(--navy)"></h2><div id="empresaMeta" class="small muted"></div></div></div><div id="produtos" class="products"></div></section></main>
<div class="cartbar" id="cartbar" hidden><div><strong id="cartQty">0 itens</strong><div class="small" id="cartTotal">R$ 0,00</div></div><button id="abrirCarrinho">Ver carrinho</button></div>
<div class="modal" id="produtoModal" hidden><div class="dialog"><div class="dialog-head"><div><h2 id="pmNome"></h2><div id="pmPreco" class="price"></div></div><button class="x" data-close="produtoModal">×</button></div><p id="pmDesc" class="muted"></p><div id="pmGrupos"></div><div class="sep"></div><div class="inline"><label>Quantidade <input id="pmQtd" type="number" min="1" max="50" value="1" style="width:80px"></label><button class="btn gold right" id="addCart">Adicionar</button></div></div></div>
<div class="modal" id="cartModal" hidden><div class="dialog"><div class="dialog-head"><h2>Seu pedido</h2><button class="x" data-close="cartModal">×</button></div><div id="cartItems" class="list" style="margin-top:14px"></div><div class="sep"></div><div class="grid grid2"><div class="field"><label>Nome</label><input id="cliNome"></div><div class="field"><label>Telefone</label><input id="cliTel" inputmode="tel"></div></div><div class="field"><label>Modalidade</label><select id="modalidade"><option value="retirada">Retirada</option><option value="entrega">Entrega</option></select></div><div id="entregaFields" class="hidden"><div class="field"><label>Endereço</label><input id="cliEndereco"></div><div class="field"><label>Complemento</label><input id="cliCompl"></div><div class="field"><label>Faixa de entrega</label><select id="faixaKm"></select></div></div><div class="inline"><strong>Total: <span id="checkoutTotal"></span></strong><button id="finalizar" class="btn gold right">Finalizar pedido</button></div></div></div>
<div class="modal" id="pagamentoModal" hidden><div class="dialog"><div class="dialog-head"><h2>Pagamento</h2><button class="x" data-close="pagamentoModal">×</button></div><div id="pagamentoConteudo"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id), toast=m=>{const e=$('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2600)};let all=[],empresa=null,produtoAtual=null,cart=[];
async function load(){try{const d=await CardapioCore.fn('cardapio-publico-lista',{method:'GET'});all=d.estabelecimentos||[];renderLista()}catch(e){$('lista').innerHTML='<div class="empty"><strong>Não foi possível carregar</strong>Tente novamente em instantes.</div>'}}
function renderLista(){const q=$('busca').value.trim().toLowerCase();const rows=all.filter(x=>!q||x.nome.toLowerCase().includes(q)||(x.categorias||[]).join(' ').toLowerCase().includes(q));$('lista').innerHTML=rows.length?rows.map(e=>`<article class="est" onclick="openEmpresa('${e.id}')"><div class="est-cover">${e.foto_url?`<img src="${CardapioCore.esc(e.foto_url)}" alt="">`:''}</div><div class="est-body"><h3>${CardapioCore.esc(e.nome)}</h3><div class="est-meta">${(e.categorias||[]).slice(0,3).map(c=>`<span class="tag">${CardapioCore.esc(c)}</span>`).join('')}</div><p class="small muted">${CardapioCore.esc(e.endereco||'')}</p></div></article>`).join(''):'<div class="empty"><strong>Nenhum estabelecimento</strong>Ainda não há empresas disponíveis no Busque Cardápio.</div>'}
window.openEmpresa=async id=>{try{const d=await CardapioCore.fn('cardapio-publico',{method:'GET',query:'?empresa='+encodeURIComponent(id)});empresa={...d.empresa,entrega:d.entrega,pagamento:d.pagamento};$('lista').classList.add('hidden');$('busca').parentElement.classList.add('hidden');$('menuWrap').classList.remove('hidden');$('empresaNome').textContent=empresa.nome;$('empresaMeta').textContent=(empresa.endereco||'')+' · '+(d.pagamento?.tipo==='pix_banco'?'Pix '+(d.pagamento.banco_nome||'bancário'):'Mercado Pago');$('produtos').innerHTML=(d.produtos||[]).map(p=>`<article class="prod" onclick='abrirProduto(${JSON.stringify(JSON.stringify(p))})'>${p.imagem_url?`<img src="${CardapioCore.esc(p.imagem_url)}" alt="">`:'<div class="ph">🍽️</div>'}<div><h3>${CardapioCore.esc(p.nome)}</h3><p>${CardapioCore.esc(p.descricao||'')}</p><div class="price">${CardapioCore.money(p.preco)}</div></div></article>`).join('')||'<div class="empty"><strong>Sem produtos</strong></div>'}catch(e){toast('Empresa indisponível.')}};
window.abrirProduto=s=>{produtoAtual=JSON.parse(s);$('pmNome').textContent=produtoAtual.nome;$('pmPreco').textContent=CardapioCore.money(produtoAtual.preco);$('pmDesc').textContent=produtoAtual.descricao||'';$('pmQtd').value=1;$('pmGrupos').innerHTML=(produtoAtual.grupos||[]).map(g=>`<div class="option-group" data-group="${g.id}" data-min="${g.minimo||0}" data-max="${g.maximo||1}" data-tipo="${g.tipo}"><strong>${CardapioCore.esc(g.nome)} ${g.obrigatorio?'*':''}</strong>${(g.opcoes||[]).map(o=>`<label class="option"><span><input type="${g.tipo==='single'?'radio':'checkbox'}" name="g_${g.id}" value="${o.id}" data-price="${o.preco_adicional||0}"> ${CardapioCore.esc(o.nome)}</span><b>${Number(o.preco_adicional)>0?'+ '+CardapioCore.money(o.preco_adicional):''}</b></label>`).join('')}</div>`).join('');$('produtoModal').hidden=false};
$('addCart').onclick=()=>{const opcoes=[];for(const g of document.querySelectorAll('#pmGrupos .option-group')){const checked=[...g.querySelectorAll('input:checked')];const min=Number(g.dataset.min||0),max=Number(g.dataset.max||1);if(checked.length<min||checked.length>max){toast('Revise as opções obrigatórias.');return}checked.forEach(i=>opcoes.push(i.value))}cart.push({produto_id:produtoAtual.id,quantidade:Number($('pmQtd').value||1),opcoes,nome:produtoAtual.nome,preco:produtoAtual.preco});$('produtoModal').hidden=true;updateCart()};
function updateCart(){const q=cart.reduce((s,x)=>s+x.quantidade,0);$('cartQty').textContent=q+' item'+(q===1?'':'s');$('cartTotal').textContent=CardapioCore.money(cart.reduce((s,x)=>s+x.preco*x.quantidade,0));$('cartbar').hidden=!cart.length}
$('abrirCarrinho').onclick=()=>{renderCart();$('cartModal').hidden=false};function renderCart(){$('cartItems').innerHTML=cart.map((x,i)=>`<div class="row"><div><strong>${CardapioCore.esc(x.nome)}</strong><div class="small muted">Qtd. ${x.quantidade}</div></div><button class="mini danger" onclick="removeItem(${i})">Remover</button></div>`).join('');$('checkoutTotal').textContent=$('cartTotal').textContent;const del=empresa?.entrega||{modo:'pickup',faixas:[]};$('modalidade').innerHTML=del.modo==='pickup'?'<option value="retirada">Retirada</option>':'<option value="retirada">Retirada</option><option value="entrega">Entrega</option>';$('faixaKm').innerHTML=(del.faixas||[]).map(f=>`<option value="${f.km}">Até ${f.km} km — ${CardapioCore.money(f.fee)}</option>`).join('');toggleEntrega()};window.removeItem=i=>{cart.splice(i,1);updateCart();renderCart()};$('modalidade').onchange=toggleEntrega;function toggleEntrega(){$('entregaFields').classList.toggle('hidden',$('modalidade').value!=='entrega')}
$('finalizar').onclick=async()=>{if(!cart.length)return;const payload={empresa_id:empresa.id,cliente:{nome:$('cliNome').value,telefone:$('cliTel').value,endereco:$('cliEndereco').value,complemento:$('cliCompl').value},modalidade:$('modalidade').value,faixa_km:Number($('faixaKm').value||0),itens:cart.map(({produto_id,quantidade,opcoes})=>({produto_id,quantidade,opcoes}))};try{$('finalizar').disabled=true;let d;if(empresa.pagamento?.tipo==='pix_banco')d=await CardapioCore.fn('cardapio-criar-pedido-banco',{body:payload});else d=await CardapioCore.fn('cardapio-criar-pedido-pagamento',{body:payload});$('cartModal').hidden=true;let html='';if(d.checkout_url)html=`<p>Seu pedido foi criado. Continue no Mercado Pago para concluir.</p><a class="btn gold" href="${CardapioCore.esc(d.checkout_url)}">Ir para o Mercado Pago</a>`;else html=`<p>Copie o Pix abaixo e pague no seu banco.</p><div class="notice"><code style="word-break:break-all">${CardapioCore.esc(d.pagamento?.pix_copia_cola||'')}</code></div><button class="btn" onclick="navigator.clipboard.writeText('${String(d.pagamento?.pix_copia_cola||'').replace(/'/g,"\\'")}')">Copiar Pix</button><p class="small muted">Pedido ${CardapioCore.esc(d.codigo||'')} · ${CardapioCore.money(d.total)}</p>`;$('pagamentoConteudo').innerHTML=html;$('pagamentoModal').hidden=false;cart=[];updateCart()}catch(e){toast(e.data?.error==='sem_creditos'?'A empresa está temporariamente indisponível.':'Não foi possível criar o pedido.')}finally{$('finalizar').disabled=false}};
$('voltar').onclick=()=>{$('menuWrap').classList.add('hidden');$('lista').classList.remove('hidden');$('busca').parentElement.classList.remove('hidden')};$('busca').oninput=renderLista;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).hidden=true);load();
</script></body></html>
