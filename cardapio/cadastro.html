<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastrar empresa — Busque Cardápio</title><link rel="stylesheet" href="styles.css"><script src="../supabase-config.js"></script><script src="cardapio-core.js"></script></head><body>
<header class="top"><div class="shell topin"><a class="brand" href="./"><div class="brandmark">B</div><div>Busque Cardápio<small>Cadastro da empresa</small></div></a><div class="actions"><a class="btn" href="painel.html">Já tenho conta</a></div></div></header>
<main class="shell main"><div class="card" style="max-width:780px;margin:auto"><h1 style="margin-top:0;color:var(--navy)">Cadastre sua empresa</h1><p>Crie a conta e deixe o básico pronto. Depois você conclui foto, produtos e recebimento no painel.</p><div id="msg"></div><div class="grid grid2"><div class="field"><label>Nome da empresa</label><input id="nome"></div><div class="field"><label>WhatsApp</label><input id="whatsapp"></div><div class="field"><label>Endereço</label><input id="endereco"></div><div class="field"><label>Categoria principal</label><input id="categoria" placeholder="Ex.: Lanches"></div><div class="field"><label>Abre às</label><input id="abertura" type="time"></div><div class="field"><label>Fecha às</label><input id="fechamento" type="time"></div></div><div class="field"><label>Entrega</label><select id="delivery"><option value="pickup">Somente retirada</option><option value="own">Faço entrega própria</option></select></div><div id="faixaWrap" class="hidden grid grid2"><div class="field"><label>Até quantos km?</label><input id="km" type="number" min="0.1" step="0.1" value="5"></div><div class="field"><label>Taxa de entrega</label><input id="fee" type="number" min="0" step="0.01" value="0"></div></div><h3>Primeiro item do cardápio</h3><div class="grid grid2"><div class="field"><label>Produto</label><input id="produto"></div><div class="field"><label>Preço</label><input id="preco" type="number" min="0" step="0.01"></div></div><h3>Acesso</h3><div class="grid grid2"><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>Senha</label><input id="senha" type="password" minlength="8"></div></div><button class="btn gold" id="criar">Criar conta e continuar</button></div></main>
<script>
const $=id=>document.getElementById(id);$('delivery').onchange=()=>$('faixaWrap').classList.toggle('hidden',$('delivery').value!=='own');$('criar').onclick=async()=>{const b=$('criar');b.disabled=true;$('msg').innerHTML='';try{const meta={cardapio_nome:$('nome').value,cardapio_whatsapp:$('whatsapp').value,cardapio_endereco:$('endereco').value,cardapio_categorias:[$('categoria').value].filter(Boolean),cardapio_horario_abertura:$('abertura').value,cardapio_horario_fechamento:$('fechamento').value,cardapio_delivery_mode:$('delivery').value,cardapio_delivery_ranges:$('delivery').value==='own'?[{km:Number($('km').value),fee:Number($('fee').value)}]:[],cardapio_produto_nome:$('produto').value,cardapio_produto_preco:Number($('preco').value),cardapio_produto_categoria:$('categoria').value||'Outros'};const d=await CardapioCore.signUp($('email').value,$('senha').value,meta);if(!d.access_token){$('msg').innerHTML='<div class="notice warn">Conta criada. Confira seu e-mail para confirmar o cadastro e depois entre no painel.</div>';return}await CardapioCore.fn('cardapio-bootstrap-empresa',{auth:true,body:{nome:$('nome').value}});location.href='painel.html'}catch(e){$('msg').innerHTML='<div class="notice bad">'+CardapioCore.esc(e.message)+'</div>'}finally{b.disabled=false}};
</script></body></html>
