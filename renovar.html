<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="robots" content="noindex,nofollow">
<title>Renovar anúncio | Busque Torres</title>
<style>
:root{--navy:#071c34;--navy2:#0d2b4d;--gold:#efbd45;--bg:#f3f6fa;--text:#142033;--muted:#66758a;--line:#dfe6ef;--green:#17834f;--red:#c93636}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 80% 10%,rgba(239,189,69,.16),transparent 28%),linear-gradient(145deg,var(--navy),var(--navy2));color:var(--text);min-height:100vh;padding:22px;display:grid;place-items:center}.card{width:min(620px,100%);background:#fff;border-radius:24px;box-shadow:0 28px 80px rgba(0,0,0,.28);overflow:hidden}.head{padding:28px 30px;background:#f9fbfd;border-bottom:1px solid var(--line)}.brand{font-size:24px;font-weight:950;color:var(--navy)}.brand span{color:#d99e16}.head p{color:var(--muted);margin:7px 0 0}.body{padding:28px 30px}.loading,.error{text-align:center;padding:35px 10px;color:var(--muted)}.error{color:var(--red)}h1{font-size:30px;margin:0 0 8px}.plan{display:inline-block;background:#eef6ff;color:#2469b2;border-radius:999px;padding:7px 10px;text-transform:uppercase;font-size:12px;font-weight:900}.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.item{background:#f6f8fb;border-radius:13px;padding:14px}.item small{display:block;color:var(--muted);font-weight:750;margin-bottom:5px}.item strong{font-size:17px}.notice{background:#fff7df;border:1px solid #f4d98e;border-radius:13px;padding:14px;line-height:1.55;color:#6e5311}.terms{display:flex;align-items:flex-start;gap:10px;margin:20px 0;color:#405065;line-height:1.5}.terms input{margin-top:4px}.terms a{color:#145d9c}.button{width:100%;border:0;border-radius:13px;background:var(--gold);padding:15px;color:#182235;font-size:16px;font-weight:950;cursor:pointer}.button:disabled{opacity:.5;cursor:not-allowed}.result{margin-top:16px;padding:14px;border-radius:13px;line-height:1.5}.result.ok{background:#e8f7ef;color:#11683e}.result.error{background:#fff0f0;color:#9d2424}.back{display:block;text-align:center;margin-top:16px;color:#54657a;text-decoration:none;font-weight:800}@media(max-width:540px){body{padding:10px}.card{border-radius:18px}.head,.body{padding:22px 17px}.summary{grid-template-columns:1fr}h1{font-size:25px}.button{min-height:50px}}
</style>
</head>
<body><main class="card"><header class="head"><div class="brand">BUSQUE <span>TORRES</span></div><p>Tudo o que você procura em um só lugar.</p></header><section class="body"><div id="loading" class="loading">Buscando seu anúncio...</div><div id="error" class="error" hidden></div><div id="content" hidden><span id="plan" class="plan"></span><h1 id="name"></h1><p id="statusText"></p><div class="summary"><div class="item"><small>Plano atual</small><strong id="planName"></strong></div><div class="item"><small>Valor por 30 dias</small><strong id="price"></strong></div><div class="item"><small>Vencimento</small><strong id="expires"></strong></div><div class="item"><small>Situação</small><strong id="status"></strong></div></div><div class="notice" id="notice"></div><label class="terms"><input id="accept" type="checkbox"><span>Li e aceito os <a href="termos.html" target="_blank">Termos de Uso</a>, a <a href="privacidade.html" target="_blank">Política de Privacidade</a> e a <a href="politica-comercial.html" target="_blank">Política Comercial</a>.</span></label><button id="payButton" class="button" type="button" disabled>Renovar anúncio</button><div id="result" class="result" hidden></div><a class="back" href="index.html">Voltar ao Busque Torres</a></div></section></main>
<script src="supabase-config.js"></script>
<script src="site-config.js"></script><script>
"use strict";
const SITE=BusqueSite.current();
BusqueSite.applyBranding();
const $=id=>document.getElementById(id);
const prices={comum:"R$ 9,90",destaque:"R$ 15,90",master:"R$ 25,90"};
const labels={comum:"Comum",destaque:"Destaque",master:"Master"};
let renewalCode="";
let companyData=null;
function fmt(v){if(!v)return "Não informado";const d=new Date(v);return Number.isNaN(d.getTime())?"Não informado":new Intl.DateTimeFormat("pt-BR",{dateStyle:"long",timeZone:"America/Sao_Paulo"}).format(d)}
function money(v){return new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(v||0))}
function showResult(message,type="ok"){const el=$("result");el.textContent=message;el.className=`result ${type}`;el.hidden=false}
async function start(){
  renewalCode=new URLSearchParams(location.search).get("codigo")||"";
  if(!renewalCode){showError("Link de renovação inválido.");return}
  try{
    const rows=await BusqueAPI.rpc("consultar_renovacao",{p_codigo:renewalCode});
    const c=Array.isArray(rows)?rows[0]:rows;
    if(!c){showError("Este link não corresponde a nenhum anúncio.");return}
    companyData=c;
    $("loading").hidden=true;$("content").hidden=false;
    $("name").textContent=c.nome;$("plan").textContent=labels[c.plano]||c.plano;
    $("planName").textContent=labels[c.plano]||c.plano;
    const configuredPrice=Number(c.valor_renovacao);
    $("price").textContent=Number.isFinite(configuredPrice)?money(configuredPrice):(prices[c.plano]||"Valor vigente");
    $("expires").textContent=fmt(c.data_vencimento);$("status").textContent=c.status;
    $("statusText").textContent="Confira os dados antes de renovar o anúncio.";
    const free=typeof c.renovacao_gratuita==="boolean"?c.renovacao_gratuita:(new Date()<new Date("2026-09-10T00:00:00-03:00"));
    $("notice").textContent=free
      ?"Durante o lançamento, esta renovação será gratuita por mais 30 dias. Nenhuma cobrança será feita."
      :"Ao continuar, o Mercado Pago abrirá o checkout seguro. Após a confirmação, o anúncio receberá mais 30 dias automaticamente.";
    $("payButton").textContent=free?"Renovar gratuitamente por 30 dias":"Pagar e renovar por 30 dias";
  }catch(e){showError(e.message||"Não foi possível consultar o anúncio.")}
}
function showError(m){$("loading").hidden=true;$("error").hidden=false;$("error").textContent=m}
$("accept").addEventListener("change",e=>{$("payButton").disabled=!e.target.checked});
$("payButton").addEventListener("click",async()=>{
  if(!companyData||!renewalCode)return;
  const btn=$("payButton");btn.disabled=true;const original=btn.textContent;btn.textContent="Processando...";$("result").hidden=true;
  try{
    const response=await BusqueAPI.invokeFunction("criar-pagamento",{codigo:renewalCode});
    if(response.gratuito){
      showResult(`Renovação concluída. Novo vencimento: ${fmt(response.novo_vencimento)}.`);
      btn.textContent="Renovação concluída";return;
    }
    if(response.checkout_url){
      showResult("Pagamento criado. Você será encaminhado ao ambiente seguro do Mercado Pago.");
      setTimeout(()=>location.href=response.checkout_url,700);return;
    }
    throw new Error("O Mercado Pago não devolveu o link de pagamento.");
  }catch(error){
    showResult(error.message||"Não foi possível iniciar a renovação.","error");
    btn.disabled=false;btn.textContent=original;
  }
});
start();
</script></body></html>
