<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Busque Serviços | Painel de homologação</title><style>body{font-family:system-ui,Arial;margin:0;background:#f3f5f8;color:#162337}header{background:#b91129;color:#fff;padding:22px}main{max-width:1000px;margin:auto;padding:24px}.notice{background:#fff3cd;padding:14px;border-radius:10px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.card,.item{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 12px #0001}.card strong{display:block;font-size:30px}.item{margin:12px 0}button{background:#b91129;color:white;border:0;border-radius:8px;padding:10px 14px;margin:5px;cursor:pointer}button.alt{background:#34465c}small{color:#526070}select{padding:9px;border-radius:8px}@media(max-width:600px){.cards{grid-template-columns:1fr}}</style></head><body><header><h1>BUSQUE SERVIÇOS — Administração</h1><div>Prévia isolada • Não conectado ao painel oficial</div></header><main><p class="notice"><strong>HOMOLOGAÇÃO:</strong> dados fictícios. Aprovar/rejeitar altera apenas esta demonstração no navegador. Nenhum pedido real é processado.</p><div class="cards"><div class="card">Pendentes<strong id="pendentes">0</strong></div><div class="card">Aprovados<strong id="aprovados">0</strong></div><div class="card">Rejeitados<strong id="rejeitados">0</strong></div></div><label>Filtrar: <select id="filtro"><option value="todos">Todos</option><option value="pendente">Pendentes</option><option value="aprovado">Aprovados</option><option value="rejeitado">Rejeitados</option></select></label><div id="lista"></div></main><script>const key='bs_painel_demo_v1';const base=[{id:1,titulo:'Consertar torneira',bairro:'Centro',descricao:'Torneira da cozinha vazando.',status:'pendente',duracao:3},{id:2,titulo:'Pintura de muro',bairro:'Praia Grande',descricao:'Pintura de muro externo.',status:'pendente',duracao:5}];let pedidos;try{pedidos=JSON.parse(localStorage.getItem(key))||base}catch(_){pedidos=base}const el=id=>document.getElementById(id);function salvar(){localStorage.setItem(key,JSON.stringify(pedidos))}function mudar(id,status){const p=pedidos.find(x=>x.id===id);if(!p)return;p.status=status;if(status==='aprovado'){p.aprovado_em=new Date().toISOString();p.expira_em=new Date(Date.now()+p.duracao*864e5).toISOString()}else{delete p.aprovado_em;delete p.expira_em}salvar();render()}function render(){for(const st of ['pendente','aprovado','rejeitado'])el(st==='pendente'?'pendentes':st==='aprovado'?'aprovados':'rejeitados').textContent=pedidos.filter(p=>p.status===st).length;el('lista').replaceChildren();for(const p of pedidos.filter(p=>el('filtro').value==='todos'||p.status===el('filtro').value)){const div=document.createElement('article');div.className='item';const h=document.createElement('h3');h.textContent=p.titulo;const desc=document.createElement('p');desc.textContent=p.descricao;const meta=document.createElement('small');meta.textContent=p.bairro+' • '+p.status+(p.expira_em?' • Expira: '+new Date(p.expira_em).toLocaleString('pt-BR'):'');div.append(h,desc,meta);if(p.status==='pendente'){for(const [label,status,cls] of [['Aprovar','aprovado',''],['Rejeitar','rejeitado','alt']]){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=()=>mudar(p.id,status);div.append(b)}}el('lista').append(div)}}el('filtro').onchange=render;render();</script></body></html>
